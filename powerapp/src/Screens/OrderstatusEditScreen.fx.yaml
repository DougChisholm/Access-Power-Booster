# Orderstatus Edit/New Screen
As: Screen

EditForm_Orderstatus:
  As: form.Edit
  DataSource: =auto_orderstatus
  Item: =BrowseGallery_Orderstatus.Selected

  EditCard_Orderstatus_auto_orderstatusname:
    As: dataCard
    FieldDisplayName: ="Orderstatusname"
    DataField: ="auto_orderstatusname"
    Required: =true


EditHeader_Orderstatus:
  As: label.Text
  Text: =If(EditForm_Orderstatus.Mode = FormMode.New, "New Orderstatus", "Edit Orderstatus")
  FontWeight: =FontWeight.Bold

SaveButton_Orderstatus:
  As: button.Button
  Text: ="Save"
  OnSelect: |=
    If(EditForm_Orderstatus.Valid,
      SubmitForm(EditForm_Orderstatus);
      Navigate(OrderstatusBrowseScreen, ScreenTransition.Back),
      Notify("Please fill in all required fields.", NotificationType.Warning)
    )

CancelButton_Orderstatus:
  As: button.Button
  Text: ="Cancel"
  OnSelect: =ResetForm(EditForm_Orderstatus); Back()
