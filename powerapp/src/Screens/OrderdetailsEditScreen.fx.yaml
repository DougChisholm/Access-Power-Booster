# Orderdetails Edit/New Screen
As: Screen

EditForm_Orderdetails:
  As: form.Edit
  DataSource: =auto_orderdetails
  Item: =BrowseGallery_Orderdetails.Selected

  EditCard_Orderdetails_auto_orderdetailsname:
    As: dataCard
    FieldDisplayName: ="Orderdetailsname"
    DataField: ="auto_orderdetailsname"
    Required: =true


EditHeader_Orderdetails:
  As: label.Text
  Text: =If(EditForm_Orderdetails.Mode = FormMode.New, "New Orderdetails", "Edit Orderdetails")
  FontWeight: =FontWeight.Bold

SaveButton_Orderdetails:
  As: button.Button
  Text: ="Save"
  OnSelect: |=
    If(EditForm_Orderdetails.Valid,
      SubmitForm(EditForm_Orderdetails);
      Navigate(OrderdetailsBrowseScreen, ScreenTransition.Back),
      Notify("Please fill in all required fields.", NotificationType.Warning)
    )

CancelButton_Orderdetails:
  As: button.Button
  Text: ="Cancel"
  OnSelect: =ResetForm(EditForm_Orderdetails); Back()
