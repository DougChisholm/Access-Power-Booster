# Northwindfeatures Edit/New Screen
As: Screen

EditForm_Northwindfeatures:
  As: form.Edit
  DataSource: =auto_northwindfeatures
  Item: =BrowseGallery_Northwindfeatures.Selected

  EditCard_Northwindfeatures_auto_northwindfeaturesname:
    As: dataCard
    FieldDisplayName: ="Northwindfeaturesname"
    DataField: ="auto_northwindfeaturesname"
    Required: =true


EditHeader_Northwindfeatures:
  As: label.Text
  Text: =If(EditForm_Northwindfeatures.Mode = FormMode.New, "New Northwindfeatures", "Edit Northwindfeatures")
  FontWeight: =FontWeight.Bold

SaveButton_Northwindfeatures:
  As: button.Button
  Text: ="Save"
  OnSelect: |=
    If(EditForm_Northwindfeatures.Valid,
      SubmitForm(EditForm_Northwindfeatures);
      Navigate(NorthwindfeaturesBrowseScreen, ScreenTransition.Back),
      Notify("Please fill in all required fields.", NotificationType.Warning)
    )

CancelButton_Northwindfeatures:
  As: button.Button
  Text: ="Cancel"
  OnSelect: =ResetForm(EditForm_Northwindfeatures); Back()
