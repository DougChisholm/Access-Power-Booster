# Customers Edit/New Screen
As: Screen

EditForm_Customers:
  As: form.Edit
  DataSource: =auto_customers
  Item: =BrowseGallery_Customers.Selected

  EditCard_Customers_auto_customersname:
    As: dataCard
    FieldDisplayName: ="Customersname"
    DataField: ="auto_customersname"
    Required: =true


EditHeader_Customers:
  As: label.Text
  Text: =If(EditForm_Customers.Mode = FormMode.New, "New Customers", "Edit Customers")
  FontWeight: =FontWeight.Bold

SaveButton_Customers:
  As: button.Button
  Text: ="Save"
  OnSelect: |=
    If(EditForm_Customers.Valid,
      SubmitForm(EditForm_Customers);
      Navigate(CustomersBrowseScreen, ScreenTransition.Back),
      Notify("Please fill in all required fields.", NotificationType.Warning)
    )

CancelButton_Customers:
  As: button.Button
  Text: ="Cancel"
  OnSelect: =ResetForm(EditForm_Customers); Back()
