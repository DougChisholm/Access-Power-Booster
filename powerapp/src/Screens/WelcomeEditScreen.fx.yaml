# Welcome Edit/New Screen
As: Screen

EditForm_Welcome:
  As: form.Edit
  DataSource: =auto_welcome
  Item: =BrowseGallery_Welcome.Selected

  EditCard_Welcome_auto_welcomename:
    As: dataCard
    FieldDisplayName: ="Welcomename"
    DataField: ="auto_welcomename"
    Required: =true


EditHeader_Welcome:
  As: label.Text
  Text: =If(EditForm_Welcome.Mode = FormMode.New, "New Welcome", "Edit Welcome")
  FontWeight: =FontWeight.Bold

SaveButton_Welcome:
  As: button.Button
  Text: ="Save"
  OnSelect: |=
    If(EditForm_Welcome.Valid,
      SubmitForm(EditForm_Welcome);
      Navigate(WelcomeBrowseScreen, ScreenTransition.Back),
      Notify("Please fill in all required fields.", NotificationType.Warning)
    )

CancelButton_Welcome:
  As: button.Button
  Text: ="Cancel"
  OnSelect: =ResetForm(EditForm_Welcome); Back()
